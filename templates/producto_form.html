{% extends "base.html" %}
{% block content %}
<h1 style="margin-top:0;font-size:1.5rem;">{% if producto %}Editar producto{% else %}Nuevo producto{% endif %}</h1>

<form class="form-grid" action="{{ action }}" method="{{ method }}">
  <div>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" required maxlength="200" value="{{ producto.nombre if producto else '' }}">
  </div>
  <div>
    <label for="categoria">Categoría</label>
    <input id="categoria" name="categoria" maxlength="100" value="{{ producto.categoria if producto else 'General' }}">
  </div>
  <div>
    <label for="precio">Precio (€)</label>
    <input id="precio" name="precio" type="text" inputmode="decimal" required
      value="{{ '%.2f'|format(producto.precio|float) if producto else '' }}" placeholder="0.00">
  </div>
  <div>
    <label for="stock">Stock</label>
    <input id="stock" name="stock" type="number" min="0" step="1" required value="{{ producto.stock if producto else 0 }}">
  </div>
  <div>
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" maxlength="2000" placeholder="Opcional">{{ producto.descripcion if producto else '' }}</textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-ghost" href="/productos">Cancelar</a>
  </div>
</form>
{% endblock %}
